<!DOCTYPE html>
<html>
<head>
    <title>PostHub - Create Post (Insecure)</title>
</head>
<body>
    <h1>Create a New Post (Insecure)</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Content:</label><br>
        <textarea name="content" rows="5" cols="40"></textarea><br><br>

        <button type="submit">Publish</button>
    </form>

    <p><a href="{{ url_for('posts') }}">Back to posts</a></p>

    <p><strong>Hint for Stored XSS test:</strong> try posting
        <code>&lt;script&gt;alert('XSS')&lt;/script&gt;</code>.
    </p>
</body>
</html>
