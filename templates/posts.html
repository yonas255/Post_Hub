<!DOCTYPE html>
<html>
<head>
    <title>Posts (Secure)</title>
</head>
<body>

    <h1>All Posts</h1>

    <a href="/create">Create New Post</a>
    <a href="/logout" style="margin-left:20px;">Logout</a>

    <hr>

    {% if posts %}
        {% for post in posts %}
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p> <!-- auto-escaped -->
            <hr>
        {% endfor %}
    {% else %}
        <p>No posts found.</p>
    {% endif %}

</body>
</html>
